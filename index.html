<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f1e5"><title>POWER UP — Emotional Reset</title><style>
*{box-sizing:border-box}body{margin:0;background:#101e29;color:#eef5f4;font-family:system-ui,sans-serif;line-height:1.65}main{max-width:540px;margin:auto;padding:24px 20px 40px}header{display:flex;justify-content:space-between;align-items:center;color:#8edac8;font-size:13px;letter-spacing:1px;font-weight:700}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:15px;padding:14px;color:#102824;background:#a1e5d0;font-weight:700;min-height:48px}button:disabled{opacity:.35;cursor:default}.ghost{background:#233745;color:#e2efed}.progress{height:5px;background:#2b404a;border-radius:10px;margin:20px 0 9px;overflow:hidden}.progress i{display:block;height:100%;background:#8edac8;transition:width .3s}.muted{color:#a5b9c0;font-size:14px}h1{font-size:30px;line-height:1.25;margin:12px 0}h2{font-size:21px;margin:8px 0}p{margin:10px 0 18px}.panel{background:#192d39;border:1px solid #304652;border-radius:24px;padding:22px;margin:18px 0}.tag{font-size:12px;letter-spacing:2px;color:#8edac8;font-weight:700}.actions{display:flex;gap:10px;margin-top:20px}.actions button:last-child{flex:1}.check{display:flex;align-items:flex-start;gap:12px;background:#243b46;border-radius:13px;padding:13px;margin:9px 0;cursor:pointer}.check input{accent-color:#8edac8;width:22px;height:22px;flex-shrink:0;margin-top:3px}textarea{width:100%;background:#10232e;border:1px solid #46606a;color:#fff;border-radius:12px;padding:12px;resize:vertical;min-height:78px;margin:5px 0 14px}textarea::placeholder{color:#91a6ad}label{display:block}input[type=range]{width:100%;accent-color:#8edac8}.score{font-size:64px;line-height:1.3;text-align:center;font-weight:700;color:#a1e5d0}.scale{display:flex;justify-content:space-between;font-size:12px;color:#a5b9c0}.quote{border-left:3px solid #8edac8;padding:10px 14px;background:#233b43;border-radius:0 12px 12px 0;margin:16px 0}.circle{width:150px;height:150px;border-radius:50%;background:#37685f;display:grid;place-items:center;margin:24px auto;transition:transform 4s ease-in-out,background 1s;text-align:center;font-weight:700}.circle.in{transform:scale(1.14);background:#477f71}.circle.out{transform:scale(.85);transition-duration:6s}.choices button{display:block;width:100%;text-align:left;margin:9px 0;background:#243b46;color:#eef5f4;border:1px solid transparent}.choices button.selected{border-color:#8edac8;background:#31584f}.small{font-size:12px;color:#9cb2b9}a{color:#a1e5d0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f0d395;outline-offset:3px}.big{width:100%}.ground{font-size:18px}.result{display:flex;justify-content:space-around;text-align:center}.result strong{display:block;font-size:38px;color:#a1e5d0}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media(min-width:600px){main{padding-top:45px}}

:root{color-scheme:light;--ink:#59463b;--muted:#79685a;--cream:#fffaf2;--sage:#78917b;--brown:#805a43}body{background:radial-gradient(ellipse at 15% 0%,#f4dfca 0,transparent 40%),radial-gradient(ellipse at 100% 45%,#e5e9d7 0,transparent 40%),#f8f1e5;color:var(--ink);min-height:100vh}main{max-width:540px;padding:22px 19px 40px}header{color:#795b46;letter-spacing:1.5px;font-size:11px}button{background:#815d46;color:#fffaf2;border-radius:18px;box-shadow:0 3px 0 #644531;min-height:50px}button:disabled{opacity:.5;box-shadow:none}.ghost{background:#eee3d3;color:#695040;box-shadow:none;border:1px solid #e0cfb8}.progress{height:8px;background:#e7d9c6;margin:21px 0 8px}.progress i{background:#81967c;border-radius:10px}.muted,.small,.scale{color:#79685a}h1{font-size:28px;letter-spacing:-.5px;color:#604838}h2{color:#6a503e}.tag{color:#73856c;letter-spacing:1.4px}.panel{background:#fffaf2;border:1px solid #e8dac7;box-shadow:0 7px 24px #7c5e4010;border-radius:25px;padding:20px}.check{background:#f4ebde;border:1px solid #eee1cf;color:#59463b}.check:has(input:checked){background:#e8eedf;border-color:#c6d3bb}.check input,input[type=range]{accent-color:#748b70}textarea{background:#fffdf8;border:1px solid #dac9b5;color:#59463b}textarea::placeholder{color:#877665}.score,.result strong{color:#6a8265}.quote{background:#e8eddf;border-left:3px solid #91a68a;color:#4f604b;border-radius:6px 15px 15px 6px}.circle{background:#dce7d4;color:#4f654c;border:5px solid #f1f5e9;box-shadow:0 0 0 1px #b8c8ac,0 0 45px #dce7d4}.circle.in{background:#c9ddc0}.choices button{background:#fffaf2;color:#59463b;border:1px solid #e2d3bf;box-shadow:none}.choices button.selected{background:#e1ebd9;border-color:#81967c;color:#40573e}a{color:#6f805e}button:focus-visible,input:focus-visible,textarea:focus-visible{outline-color:#a37b55}.actions{position:sticky;bottom:0;background:#f8f1e5ed;padding:12px 0 14px;backdrop-filter:blur(8px);z-index:2}.companion{display:flex;align-items:center;gap:12px;background:#fffaf0b0;border:1px solid #e6d6c0;border-radius:24px;padding:5px 14px 5px 3px;margin:18px 0 20px;min-height:110px}.companion svg{width:116px;flex-shrink:0;height:108px}.companion .hello{font-size:11px;color:#876b53;letter-spacing:1px;font-weight:700}.companion p{font-size:14px;line-height:1.6;margin:3px 0;color:#63503e}.companion .heart{transform-origin:100px 20px;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-4px)}}@media(prefers-reduced-motion:reduce){.companion .heart{animation:none}}footer{padding-top:12px;text-align:center}@media(max-width:350px){.companion svg{width:92px}h1{font-size:25px}}
</style></head><body><main><header><span>POWER UP / EMOTIONAL RESET</span><button id="restart" class="ghost" style="padding:7px 12px;min-height:36px;font-size:12px">เริ่มใหม่</button></header><div class="progress" role="progressbar" aria-label="ความคืบหน้า" aria-valuemin="0" aria-valuemax="8"><i id="bar"></i></div><div id="stepLabel" class="muted"></div><div class="companion"><svg viewBox="0 0 130 120" role="img" aria-label="น้องหมีถือหัวใจ"><ellipse cx="65" cy="106" rx="43" ry="7" fill="#e5d6c1"/><g stroke="#8c654d" stroke-width="2.2" stroke-linejoin="round"><ellipse cx="65" cy="81" rx="29" ry="26" fill="#c89b73"/><circle cx="33" cy="32" r="15" fill="#c89b73"/><circle cx="97" cy="32" r="15" fill="#c89b73"/><circle cx="33" cy="32" r="8" fill="#e7b9a0" stroke="none"/><circle cx="97" cy="32" r="8" fill="#e7b9a0" stroke="none"/><rect x="26" y="25" width="78" height="60" rx="30" fill="#d6ac84"/><ellipse cx="65" cy="65" rx="18" ry="13" fill="#f5dcc0" stroke="none"/><path d="M61 59 Q65 55 69 59 Q65 65 61 59" fill="#6b4c3c" stroke="none"/><path d="M65 62v4m0 0q-5 5-9 0m9 0q5 5 9 0" fill="none" stroke-linecap="round"/><circle cx="47" cy="51" r="2.8" fill="#604536" stroke="none"/><circle cx="83" cy="51" r="2.8" fill="#604536" stroke="none"/><ellipse cx="39" cy="62" rx="6" ry="3.5" fill="#e9a395" stroke="none"/><ellipse cx="91" cy="62" rx="6" ry="3.5" fill="#e9a395" stroke="none"/><path d="M65 100C35 82 48 69 65 81C82 69 95 82 65 100Z" fill="#d98778" stroke="#b66e60"/><ellipse cx="43" cy="85" rx="10" ry="7" fill="#d6ac84" transform="rotate(24 43 85)"/><ellipse cx="87" cy="85" rx="10" ry="7" fill="#d6ac84" transform="rotate(-24 87 85)"/></g><path class="heart" d="M110 19C98 11 103 4 110 10C117 4 122 11 110 19Z" fill="#d98778"/><path d="M12 83q12-20 16 4q-10 1-16-4M109 100q-3-19 13-19q1 13-13 19" fill="#a5b393"/></svg><div><div class="hello">LITTLE BEAR · เพื่อนดูแลใจ</div><p id="bearText"></p></div></div><section id="screen" aria-live="polite"></section><div class="actions" id="nav"><button class="ghost" id="back">ย้อนกลับ</button><button id="next">ไปต่อ</button></div><footer class="small">พื้นที่ส่วนตัว • ไม่ส่งข้อมูลออกจากเครื่อง • คะแนนเป็นการประเมินความรู้สึก ไม่ใช่การวินิจฉัย<br>ไม่ต้องฝืนทำให้ครบ หากไม่สบายใจสามารถหยุดได้</footer></main><script>
const $=id=>document.getElementById(id);let step=0, timer=null, state={before:5,after:5,checks:{},notes:{},choice:'',breath:false};const total=8;
const titles=['เริ่มต้น','STOP','Grounding 3-3-3','Self-soothing','CBT','ตรวจสอบความต้องการ','ประเมินอีกครั้ง','Secure response'];
function clearTimer(){clearInterval(timer);timer=null}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function check(id,label){return `<label class="check"><input type="checkbox" data-check="${id}" ${state.checks[id]?'checked':''}><span>${label}</span></label>`}function note(id,label,placeholder){return `<label>${label}<textarea data-note="${id}" placeholder="${placeholder}">${esc(state.notes[id])}</textarea></label>`}function scale(key){return `<div class="score" id="score">${state[key]}<span style="font-size:22px">/10</span></div><input type="range" min="0" max="10" value="${state[key]}" aria-label="ระดับความกังวล" id="range"><div class="scale"><span>0 สงบ</span><span>10 รุนแรงมาก</span></div>`}function panel(s){return `<div class="panel">${s}</div>`}function all(ids){return ids.every(id=>state.checks[id])}function ready(){return [true,all(['s','t','o','p']),all(['g1','g2','g3']),state.breath||state.checks.alt,all(['c1','c2','c3','c4','c5']),!!state.choice,true,true][step]}
function render(){clearTimer();$('bearText').textContent=['วันนี้เรามาดูแลใจของเรากันนะ ค่อย ๆ ไปทีละขั้น','ความรู้สึกไม่จำเป็นต้องกลายเป็นการกระทำทันที','กลับมาอยู่กับสิ่งรอบตัวเราสักครู่นะ','หายใจสบาย ๆ ตามจังหวะที่เหมาะกับเรา','มองความคิดด้วยความอ่อนโยน แล้วตรวจสอบความจริง','ความต้องการของเราก็สำคัญนะ','ไม่ว่าคะแนนจะเป็นเท่าไร ให้เวลาตัวเองได้','ค่อย ๆ เลือกสิ่งที่ดีต่อใจเราและความสัมพันธ์'][step];$('bar').style.width=((step+1)/total*100)+'%';document.querySelector('.progress').setAttribute('aria-valuenow',step+1);$('stepLabel').textContent=`ขั้นที่ ${step+1} / ${total} · ${titles[step]}`;let h='';switch(step){case 0:h=`<div class="tag">CHECK IN</div><h1>ตอนนี้ใจเราเป็นอย่างไร?</h1><p>ไม่ต้องรีบแก้ไขความสัมพันธ์ ตอนนี้เราจะดูแลตัวเองก่อน</p>${panel('<h2>ความกังวลตอนนี้มากแค่ไหน?</h2>'+scale('before'))}${note('trigger','อะไรเป็นตัวกระตุ้น? (ไม่บังคับ)','เช่น เขายังไม่ตอบข้อความ…')}`;break;
case 1:h=`<div class="tag">DBT SKILL</div><h1>STOP — หยุดวงจรเดิม</h1><p>ทำทีละข้อ แล้วกดเครื่องหมายเมื่อทำเสร็จ</p>${panel(check('s','<b>S · Stop</b><br>หยุดส่งข้อความซ้ำ ประชด หรือรีบตัดสินใจ')+check('t','<b>T · Take a step back</b><br>วางโทรศัพท์หรือถอยจากบทสนทนาชั่วคราว')+check('o','<b>O · Observe</b><br>สังเกตความรู้สึก ร่างกาย และแรงกระตุ้นของเรา')+check('p','<b>P · Proceed mindfully</b><br>ตั้งใจเลือกการตอบสนอง ไม่ทำตามความกลัวทันที'))}<div class="quote">ฉันรู้สึกกังวลได้ โดยไม่ต้องทำอะไรทันที</div>`;break;
case 2:h=`<div class="tag">BACK TO NOW</div><h1>กลับมาสู่ปัจจุบัน</h1><p>ค่อย ๆ มอง ฟัง และขยับร่างกายจริง ๆ</p>${panel('<h2>👁 มองเห็น 3 สิ่ง</h2>'+note('see','ระบุในใจหรือพิมพ์ก็ได้','เช่น โต๊ะ ประตู แก้วน้ำ')+check('g1','ฉันระบุสิ่งที่เห็นแล้ว 3 สิ่ง')+'<h2>👂 ได้ยิน 3 เสียง</h2>'+note('hear','ตั้งใจฟังรอบตัว','เช่น เสียงพัดลม รถ ลมหายใจ')+check('g2','ฉันระบุเสียงแล้ว 3 เสียง')+'<h2>✋ ขยับร่างกาย 3 ส่วน</h2>'+check('g3','ฉันขยับนิ้วมือ ไหล่ และปลายเท้าแล้ว (หรือส่วนที่สะดวก)'))}<p class="muted">หากใช้ประสาทสัมผัสบางอย่างไม่ได้ ให้แทนด้วยการรับรู้สัมผัสที่ทำได้</p>`;break;
case 3:h=`<div class="tag">SELF-SOOTHING</div><h1>ให้ร่างกายค่อย ๆ สงบ</h1>${panel('<div id="breathCircle" class="circle">พร้อมเมื่อไหร่<br>กดเริ่ม</div><div id="breathStatus" style="text-align:center" class="muted">หายใจเข้า 4 วินาที ออก 6 วินาที · 5 รอบ</div><button id="breathStart" class="big" style="margin-top:18px">'+(state.breath?'ฝึกอีกครั้ง':'เริ่มหายใจ 50 วินาที')+'</button>') }<div class="quote">ความรู้สึกนี้อาจค่อย ๆ เบาลง ฉันไม่จำเป็นต้องรีบหาคำตอบทุกอย่าง</div>${check('alt','ฉันเลือกหายใจตามธรรมชาติ หรือพักจนพร้อมแทนการจับเวลาแล้ว')}<p class="small">ไม่ต้องกลั้นหายใจหรือฝืน หากเวียนหัวให้หยุด</p>`;break;
case 4:h=`<div class="tag">CBT · THOUGHT CHECK</div><h1>ความกลัว หรือข้อเท็จจริง?</h1><p>ตอบในใจหรือพิมพ์ แล้วติ๊กแต่ละข้อเมื่อคิดเสร็จ</p>${panel(note('fact','1. เกิดอะไรขึ้นจริง ๆ?','เขายังไม่ตอบข้อความ')+check('c1','แยกเหตุการณ์จริงแล้ว')+note('thought','2. เรากำลังตีความว่าอะไร?','เขาอาจไม่สนใจเราแล้ว')+check('c2','รับรู้ความคิดอัตโนมัติแล้ว')+note('evidence','3. หลักฐานสนับสนุนและคัดค้านคืออะไร?','มีอะไรยืนยันหรือขัดกับความคิดนี้บ้าง')+check('c3','ตรวจสอบหลักฐานแล้ว')+note('alternative','4. มีคำอธิบายอื่นที่เป็นไปได้ไหม?','เขาอาจยุ่ง หรืออาจมีเรื่องที่ต้องคุยกันจริง ๆ')+check('c4','พิจารณาความเป็นไปได้อื่นแล้ว')+note('balanced','5. ความคิดที่สมดุลกว่าคืออะไร?','ตอนนี้ยังไม่รู้เหตุผล ฉันรอและคุยได้')+check('c5','เลือกความคิดที่สมดุลแล้ว'))}`;break;
case 5:h=`<div class="tag">NEEDS & BOUNDARIES</div><h1>จริง ๆ แล้วเราต้องการอะไร?</h1><p>เลือกสิ่งที่ตรงกับตัวเองมากที่สุด</p><div class="choices">${['อยากได้รับคำยืนยันว่าเขายังสนใจ','ต้องการความชัดเจนหรือความสม่ำเสมอ','ต้องการขอโทษเรื่องที่ทำให้อีกฝ่ายอึดอัด','ต้องการพื้นที่ให้ตัวเองสงบก่อน','มีพฤติกรรมของอีกฝ่ายที่ทำให้ไม่สบายใจจริง ๆ'].map((v,i)=>`<button data-choice="${i}" class="${state.choice===String(i)?'selected':''}" aria-pressed="${state.choice===String(i)}">${v}</button>`).join('')}</div><div class="quote">ความต้องการของฉันมีความหมาย แต่ฉันไม่จำเป็นต้องบังคับให้อีกฝ่ายตอบสนองทันที</div>`;break;
case 6:h=`<div class="tag">CHECK IN AGAIN</div><h1>ตอนนี้เรารู้สึกอย่างไร?</h1>${panel('<div class="muted">ก่อนเริ่ม: '+state.before+'/10</div>'+scale('after'))}<div id="feedback" class="quote"></div><button id="repeat" class="ghost big">กลับไปฝึก Grounding อีกครั้ง</button><p class="small">คะแนนไม่ใช่เกณฑ์ตัดสินว่าควรคุยหรือไม่ ให้ดูความพร้อมของตัวเองด้วย</p>`;break;
case 7:let msgs=['ช่วงนี้เรารู้สึกกังวลนิดหน่อย ไว้เธอสะดวกเราค่อยคุยกันนะ','เราอยากคุยเรื่องความชัดเจนในการสื่อสารกัน ไว้สะดวกทั้งคู่ค่อยคุยนะ','ขอโทษนะที่ก่อนหน้านี้เราทำให้เธอรู้สึกกดดัน เราจะพยายามจัดการความรู้สึกของตัวเองให้ดีขึ้น','ตอนนี้เราขอเวลาจัดการความรู้สึกตัวเองก่อน ไว้พร้อมแล้วค่อยคุยกันนะ','มีบางเรื่องที่ทำให้เราไม่สบายใจ เราอยากคุยกันตรง ๆ เพื่อหาทางที่เหมาะกับทั้งคู่'];h=`<div class="tag">SECURE RESPONSE</div><h1>เลือกตอบสนองอย่างมั่นคง</h1>${panel(`<div class="result"><div><span class="muted">ก่อนเริ่ม</span><strong>${state.before}</strong></div><div><span class="muted">ตอนนี้</span><strong>${state.after}</strong></div></div><p>${state.after<state.before?'ความกังวลลดลงแล้ว แม้จะยังไม่หายทั้งหมด':'แม้ความกังวลยังไม่ลดลง การรับรู้และเลือกพฤติกรรมก็มีความหมาย'}</p>`)}<h2>ถ้าพร้อมคุย ลองใช้ข้อความนี้</h2><div class="quote" id="message">${msgs[Number(state.choice)]||msgs[3]}</div><button id="copy" class="ghost big">คัดลอกข้อความ</button><p>หรือเลือกยังไม่ส่งข้อความ แล้วกลับไปทำกิจกรรมของตัวเองก็ได้</p><div class="quote"><b>ฉันมีคุณค่า แม้ไม่ได้รับคำยืนยันในทุกนาที</b><br>ฉันรักได้ โดยไม่ต้องให้ความกลัวควบคุมการกระทำ</div><button id="again" class="big">กลับหน้าแรก</button><p class="small">หากความกังวลเกิดซ้ำและกระทบชีวิตหรือความสัมพันธ์ ลองปรึกษานักจิตวิทยา หรือโทรสายด่วนสุขภาพจิต 1323</p>`;break;}
$('screen').innerHTML=h;$('nav').style.display=step===7?'none':'flex';$('back').style.display=step===0?'none':'block';$('next').textContent=step===0?'เริ่ม Emotional Reset':step===6?'ไปสู่การตอบสนอง':'ทำขั้นนี้แล้ว · ไปต่อ';$('next').disabled=!ready();document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{state.checks[e.dataset.check]=e.checked;$('next').disabled=!ready()});document.querySelectorAll('[data-note]').forEach(e=>e.oninput=()=>state.notes[e.dataset.note]=e.value);document.querySelectorAll('[data-choice]').forEach(e=>e.onclick=()=>{state.choice=e.dataset.choice;render()});if($('range')){$('range').oninput=e=>{state[step===0?'before':'after']=Number(e.target.value);$('score').innerHTML=e.target.value+'<span style="font-size:22px">/10</span>';feedback()};feedback()}if($('breathStart'))$('breathStart').onclick=breathing;if($('repeat'))$('repeat').onclick=()=>go(2);if($('again'))$('again').onclick=reset;if($('copy'))$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('message').textContent);$('copy').textContent='คัดลอกแล้ว'}catch{let r=document.createRange();r.selectNodeContents($('message'));window.getSelection().removeAllRanges();window.getSelection().addRange(r);$('copy').textContent='เลือกข้อความแล้ว โปรดกดคัดลอก'}};}
function feedback(){if(!$('feedback'))return;$('feedback').textContent=state.after>=7?'หากยังรู้สึกท่วมท้น ลองพักหรือฝึก Grounding ซ้ำก่อน ยังไม่ต้องตัดสินใจเรื่องสำคัญ':state.after<state.before?'ความกังวลลดลง '+(state.before-state.after)+' คะแนน ลองสังเกตว่าตอนนี้พร้อมคุยอย่างสงบหรือยัง':'ไม่เป็นไรหากคะแนนยังไม่ลด ลองให้เวลาตัวเองเพิ่ม หรือเลือกพักก่อน'}
function breathing(){if(timer){clearTimer();$('breathCircle').className='circle';$('breathCircle').textContent='พักได้';$('breathStart').textContent='เริ่มใหม่';return}let start=Date.now();$('breathStart').textContent='หยุดการจับเวลา';function tick(){let t=Math.floor((Date.now()-start)/1000);if(t>=50){clearTimer();state.breath=true;$('breathCircle').className='circle';$('breathCircle').textContent='ครบ 5 รอบ';$('breathStatus').textContent='สังเกตความรู้สึกของตัวเอง';$('breathStart').textContent='ฝึกอีกครั้ง';$('next').disabled=false;return}let x=t%10,phase=x<4?'in':'out';$('breathCircle').className='circle '+phase;$('breathCircle').innerHTML=(x<4?'หายใจเข้า':'หายใจออก')+'<br>'+(x<4?4-x:10-x);$('breathStatus').textContent='รอบ '+(Math.floor(t/10)+1)+' / 5'}tick();timer=setInterval(tick,200)}function go(n){step=n;render();window.scrollTo(0,0)}function reset(){clearTimer();state={before:5,after:5,checks:{},notes:{},choice:'',breath:false};go(0)}$('restart').onclick=()=>{if(confirm('เริ่มใหม่และล้างคำตอบครั้งนี้?'))reset()};$('back').onclick=()=>go(Math.max(0,step-1));$('next').onclick=()=>{if(ready())go(step+1)};render();</script></body></html>
